<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>魂晶獵手 · Soulshard Hunter</title>
  <link rel="icon" href="/icon.svg?v=1" type="image/svg+xml" sizes="any" />
  <meta name="theme-color" content="#0b0d1a" />
  <style>
    /* 1.8: pixel bitmap font for numeric HUD values. Self-hosted (was a Google Fonts CDN
       <link>, which handed the player's IP + UA to a third party on every page load and broke
       the "no external requests" claim); latin subset only — PIXEL_FONT is ASCII-only by
       design, see engine/renderer.js. SIL OFL 1.1, licence in assets/font/OFL.txt. */
    @font-face {
      font-family: 'Press Start 2P';
      font-style: normal; font-weight: 400; font-display: swap;
      src: url('./assets/font/PressStart2P-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    :root {
      --bg: #0b0d1a;

      /* R28/W4-H (ART-08) — the single source of truth for DOM "chrome" (modal frames,
         buttons, tabs, badges) shared by src/net/ui.js and src/net/social.js, so their two
         independently-evolved stylesheets stop drifting apart. Values mirror the Canvas UI
         vocabulary in src/engine/{palette,renderer}.js — P.shard/P.shardL/P.emberL for
         accents, UI.FONT_* for type sizes — so a screenshot with the labels hidden still
         reads as one game. DOM text is NOT multiplied by uiScale() (a different coordinate
         system than the canvas); these are fixed px tuned to read right at a 1280-wide
         viewport, same as the canvas base sizes. */
      --chrome-bg-top: #1a2042;
      --chrome-bg-bot: #0e1126;
      --chrome-border: #34407a;
      --chrome-border-soft: #2a3056;
      --chrome-accent: #48e0d0;        /* P.shard */
      --chrome-accent-light: #a8fff4;  /* P.shardL */
      --chrome-gold: #ffd479;          /* P.emberL */
      --chrome-ink: #0b0e20;           /* field/input fill — matches canvas P.ink family */
      --chrome-text: #dfe3f5;
      --chrome-text-dim: #8ea0d8;
      --chrome-danger: #ff8a7a;        /* P.redL */
      --chrome-danger-light: #ffb4a8;
      --chrome-ok: #9be36b;

      --chrome-radius: 10px;           /* matches canvas uiRect() radius 8–14 at uiScale()~1 */
      --chrome-radius-sm: 7px;
      --chrome-border-w: 2px;          /* matches canvas uiButton() default lw:2 */
      --chrome-header-h: 44px;         /* matches the title-notes panel header band (46*S@1280) */

      --chrome-font-title: 22px;       /* UI.FONT_TITLE */
      --chrome-font-heading: 16px;     /* UI.FONT_HEADING */
      --chrome-font-body: 13px;        /* UI.FONT_BODY */
      --chrome-font-caption: 10.5px;   /* UI.FONT_CAPTION — repo-wide floor, never go smaller */
      --chrome-weight-title: 900;
      --chrome-weight-heading: 800;
      --chrome-weight-body: 600;

      --chrome-gap-sm: 8px;
      --chrome-gap-md: 16px;
      --chrome-gap-lg: 24px;

      /* button three-state (+ error, via --chrome-danger above) tokens */
      --chrome-btn-primary-1: #5cf0e0;
      --chrome-btn-primary-2: #2bb5a6;
      --chrome-btn-primary-fg: #04221f;
      --chrome-btn-ghost-1: #202852;
      --chrome-btn-ghost-2: #171d3c;
      --chrome-btn-ghost-fg: #cdd3f0;
      --chrome-btn-warn-1: #43243a;
      --chrome-btn-warn-2: #321c2c;
      --chrome-btn-warn-fg: #ffb4a8;
      --chrome-focus-ring: #ffffff;
      --chrome-disabled-bg: #2a4a48;
      --chrome-disabled-fg: #789;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg);
      font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
      color: #e8e8f0;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(circle at 50% 35%, #181b33 0%, #0b0d1a 70%);
    }
    canvas#game {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #0b0d1a;
      box-shadow: 0 0 0 2px #2a2f50, 0 18px 60px rgba(0,0,0,0.6);
      touch-action: none;
      cursor: crosshair;
    }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: var(--bg); z-index: 50; transition: opacity .4s;
    }
    #loading .title { font-size: 28px; letter-spacing: 6px; color: #ffd479; }
    #loading .bar { width: 220px; height: 8px; background: #1c2040; border-radius: 4px; overflow: hidden; }
    #loading .bar > i { display:block; height:100%; width:0%; background: linear-gradient(90deg,#ffb142,#ffd479); transition: width .2s; }
    #loading .hint { font-size: 12px; color: #6b7099; letter-spacing: 2px; }
    #fatal { position: fixed; inset: 0; display:none; flex-direction:column; gap:10px; align-items:center; justify-content:center;
      background:#160a0a; color:#ff8a8a; font-family: monospace; padding: 24px; text-align:center; z-index:99; }
    #fatal pre { max-width: 90vw; overflow:auto; text-align:left; color:#ffcaca; font-size:12px; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
  </div>
  <div id="loading">
    <div class="title">魂晶獵手</div>
    <div class="bar"><i id="loadbar"></i></div>
    <div class="hint">SOULSHARD HUNTER · loading…</div>
  </div>
  <div id="fatal"><div>⚠ 發生錯誤</div><pre id="fatalmsg"></pre></div>
  <script>
    // Surface uncaught errors visibly so self-testing can detect failures.
    window.addEventListener('error', (e) => {
      const f = document.getElementById('fatal');
      const m = document.getElementById('fatalmsg');
      if (f && m) { f.style.display = 'flex'; m.textContent = (e.error && e.error.stack) || e.message || String(e); }
      window.__GAME_ERROR__ = (e.error && e.error.stack) || e.message || String(e);
    });
    window.addEventListener('unhandledrejection', (e) => {
      window.__GAME_ERROR__ = String(e.reason && (e.reason.stack || e.reason));
    });
  </script>
  <script type="module" src="./src/main.js"></script>
  <script>
    // round16/7.4 — offline cache. Registered ONLY in production: the dev server (tools/serve.mjs)
    // is intentionally no-cache so edited ES modules never go stale; a SW would defeat that and
    // silently break local testing. See sw.js for the staleness-aware strategy.
    if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
